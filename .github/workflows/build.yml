name: Build Windows exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (single file, self-contained, win-x64)
        run: >
          dotnet publish source/SwitchEmuModDownloader/SwitchEmuModDownloader.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: SwitchEmuModDownloader-1.6.0-win-x64
          path: publish/SwitchEmuModDownloader.exe
